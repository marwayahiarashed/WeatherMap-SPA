<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherMap SPA Project</title>
    
  
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">
        
        <div class="top-bar">
            <h2>WeatherMap SPA</h2>
            <p>Advanced Web Technologies Course Project</p>
        </div>
        
       
        <form id="searchForm" class="search-section">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g., Port Sudan, Khartoum)..." required>
            <button type="submit" id="submitSearchBtn">Get Weather</button>
        </form>

        
        <div id="loadingSpinner" class="spinner hidden"></div>

        <div class="app-content-area">
            
            <div id="weatherResultPanel" class="result-card hidden">
                <h3 id="displayCityName">City Name</h3>
                <div class="stat-row"><strong>Temperature:</strong> <span id="valTemp">-</span></div>
                <div class="stat-row"><strong>Condition:</strong> <span id="valCondition">-</span></div>
                <div class="stat-row"><strong>Humidity:</strong> <span id="valHumidity">-</span></div>
                <div class="stat-row"><strong>Wind Speed:</strong> <span id="valWind">-</span></div>
            </div>

            
            <div id="mapContainer"></div>
        </div>
    </div>

    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
 
    <script src="app.js"></script>
</body>
</html>
